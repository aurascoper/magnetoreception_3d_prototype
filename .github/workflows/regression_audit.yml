name: Magnetoreception 3D Interface & Provenance Audit

on:
  push:
    branches:
      - feat/magnetoreception-3d-interface
      - main
  pull_request:

jobs:
  regression-and-manifest-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Chrome & Runtime Versions
        run: |
          node -v
          google-chrome --version

      - name: Run Scientific Calculation Provenance & Counterfactual Invariants Suite
        run: |
          node test_calculation_provenance_and_invariants.js

      - name: Run Headless Chrome Interface & Regression Audit Suite
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node test_magnetoreception_interface.js | tee ci_test_output.txt
          python3 -c '
          import hashlib, json, subprocess, platform
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
          node_v = subprocess.check_output(["node", "-v"]).decode().strip()
          chrome_v = subprocess.check_output(["google-chrome", "--version"]).decode().strip()
          files = [
              "index.html",
              "evidence_manifest.json",
              "README.md",
              "test_calculation_provenance_and_invariants.js",
              "test_magnetoreception_interface.js"
          ]
          hashes = {f: {"bytes": len(open(f,"rb").read()), "sha256": hashlib.sha256(open(f,"rb").read()).hexdigest()} for f in files}
          receipt = {
              "schema": "ci_verification_receipt_v2",
              "verification_scope_disclaimer": "SOFTWARE & PROVENANCE AUDIT ONLY: Passing CI verifies UI regression assertions, manifest schema, SI calculation provenance, counterfactual trajectory identities, and design-matrix rank/estimability. It does NOT validate biological magnetoreception or fungal radiotropism.",
              "commit_sha": commit,
              "node_version": node_v,
              "chrome_version": chrome_v,
              "platform": platform.platform(),
              "artifact_hashes": hashes,
              "test_output": open("ci_test_output.txt").read().strip().splitlines()
          }
          open("ci_verification_receipt.json", "w").write(json.dumps(receipt, indent=2))
          '

      - name: Upload CI Verification Receipt Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnetoreception-ci-receipt
          path: |
            ci_verification_receipt.json
            ci_test_output.txt
